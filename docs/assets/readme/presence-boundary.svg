<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Presence collaboration boundary</title>
  <desc id="desc">A human owns Mobile, an admitted browser agent owns Tablet, Desktop is reference, and Presence protects shared state from out-of-scope, stale, and revoked writes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52e6d4"/>
      <stop offset="1" stop-color="#61a9ff"/>
    </linearGradient>
    <linearGradient id="human" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b78cff"/>
      <stop offset="1" stop-color="#8d6cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="760" rx="34" fill="url(#bg)"/>
  <rect x="1" y="1" width="1438" height="758" rx="33" fill="none" stroke="#242936"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="72" y="86" fill="#f5f7fb" font-size="30" font-weight="700">Presence</text>
    <text x="72" y="124" fill="#8f98aa" font-size="17">Humans and browser agents, in the same live app — without sharing unrestricted authority.</text>

    <rect x="530" y="66" width="380" height="76" rx="20" fill="#121721" stroke="#303848"/>
    <circle cx="562" cy="104" r="6" fill="#b78cff" filter="url(#glow)"/>
    <text x="580" y="99" fill="#8f98aa" font-size="12" font-weight="700" letter-spacing="1.5">SHARED PROJECT</text>
    <text x="580" y="121" fill="#eef2f7" font-size="14">canonical revision · r32</text>
    <text x="842" y="112" fill="#8f98aa" font-size="13" text-anchor="end">live</text>

    <path d="M300 218 C410 164 480 157 560 141" stroke="#3a4050" stroke-width="2" fill="none"/>
    <path d="M720 218 C720 180 720 170 720 143" stroke="#52e6d4" stroke-opacity=".55" stroke-width="2" fill="none"/>
    <path d="M1135 218 C1032 164 966 157 878 141" stroke="#9d7aff" stroke-opacity=".5" stroke-width="2" fill="none"/>

    <g transform="translate(72 218)">
      <rect width="430" height="390" rx="28" fill="#0d1118" stroke="#262d3a"/>
      <text x="24" y="40" fill="#8f98aa" font-size="12" font-weight="700" letter-spacing="1.5">REFERENCE</text>
      <text x="24" y="70" fill="#f2f4f8" font-size="22" font-weight="700">Desktop</text>
      <rect x="24" y="98" width="382" height="254" rx="18" fill="#f0ede5"/>
      <rect x="44" y="122" width="338" height="26" rx="9" fill="#e4e0d8"/>
      <rect x="44" y="174" width="150" height="20" rx="7" fill="#1d2026"/>
      <rect x="44" y="207" width="226" height="12" rx="6" fill="#d0ccc3"/>
      <rect x="44" y="229" width="190" height="12" rx="6" fill="#d0ccc3"/>
      <rect x="282" y="174" width="100" height="106" rx="16" fill="#1b1e24" stroke="#8984ff" stroke-width="4"/>
      <text x="24" y="377" fill="#697386" font-size="13">read-only collaboration context</text>
    </g>

    <g transform="translate(530 218)">
      <rect width="380" height="390" rx="28" fill="#0d1218" stroke="#3d6670" stroke-width="2"/>
      <circle cx="26" cy="34" r="5" fill="#52e6d4" filter="url(#glow)"/>
      <text x="42" y="39" fill="#63dcca" font-size="12" font-weight="800" letter-spacing="1.3">YOUR AGENT</text>
      <text x="24" y="70" fill="#f2f4f8" font-size="22" font-weight="700">Tablet</text>
      <rect x="24" y="98" width="332" height="254" rx="18" fill="#f0ede5"/>
      <rect x="44" y="122" width="292" height="24" rx="9" fill="#e4e0d8"/>
      <rect x="83" y="174" width="214" height="122" rx="22" fill="#171a20" stroke="url(#agent)" stroke-width="5"/>
      <rect x="104" y="198" width="172" height="25" rx="8" fill="#2a2f37"/>
      <rect x="104" y="238" width="76" height="42" rx="9" fill="#292d35"/>
      <rect x="196" y="238" width="80" height="42" rx="9" fill="#292d35"/>
      <text x="24" y="377" fill="#63dcca" font-size="13" font-weight="700">scope: Tablet only · provisional until accepted</text>
    </g>

    <g transform="translate(938 218)">
      <rect width="430" height="390" rx="28" fill="#100f17" stroke="#4a3b69" stroke-width="2"/>
      <circle cx="26" cy="34" r="5" fill="#b78cff" filter="url(#glow)"/>
      <text x="42" y="39" fill="#b99aff" font-size="12" font-weight="800" letter-spacing="1.3">YOU</text>
      <text x="24" y="70" fill="#f2f4f8" font-size="22" font-weight="700">Mobile</text>
      <rect x="64" y="98" width="200" height="254" rx="26" fill="#f0ede5"/>
      <text x="84" y="135" fill="#1b1e24" font-size="11" font-weight="800" letter-spacing="2">AURORA</text>
      <rect x="84" y="166" width="160" height="56" rx="10" fill="none" stroke="#8fe4ca" stroke-width="3"/>
      <rect x="84" y="238" width="160" height="44" rx="12" fill="#15171c"/>
      <rect x="286" y="110" width="120" height="224" rx="18" fill="#121620" stroke="#353d4c"/>
      <text x="304" y="145" fill="#7d8798" font-size="10" font-weight="700">YOU · HEADLINE</text>
      <rect x="304" y="170" width="84" height="28" rx="8" fill="#17372f" stroke="#24594b"/>
      <rect x="304" y="212" width="84" height="28" rx="8" fill="#1c222c"/>
      <rect x="304" y="254" width="84" height="28" rx="8" fill="#1c222c"/>
      <text x="24" y="377" fill="#b99aff" font-size="13" font-weight="700">human edits canonical shared state</text>
    </g>

    <g transform="translate(420 640)">
      <rect width="600" height="72" rx="20" fill="#12161e" stroke="#313847"/>
      <circle cx="32" cy="36" r="7" fill="#ffb454"/>
      <text x="54" y="31" fill="#f3f5f8" font-size="14" font-weight="750">STALE WRITE BLOCKED</text>
      <text x="54" y="52" fill="#8f98aa" font-size="13">agent based on r31 · canonical project is r32 · re-read before retry</text>
      <rect x="455" y="21" width="118" height="30" rx="15" fill="#251d12" stroke="#60431e"/>
      <text x="514" y="41" fill="#ffc36f" font-size="11" text-anchor="middle" font-weight="800">STALE_STATE</text>
    </g>

    <text x="72" y="704" fill="#697386" font-size="12">out-of-scope writes denied · stale writes denied · post-revocation writes denied</text>
  </g>
</svg>