[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Presence is a client-routed SPA. Deep links such as /remote/:sessionId must
# boot index.html so React Router can resolve the authority session.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
